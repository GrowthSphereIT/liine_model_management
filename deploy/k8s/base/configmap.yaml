# Non-secret runtime config for liine.
# Secrets (MONGODB_URI, ADMIN_PASSWORD, SESSION_SECRET) live in the `liine-app`
# Secret, created by deploy/scripts/apply-secrets.sh.
# NEXT_PUBLIC_* vars are baked into the image at build time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: liine-config
  namespace: liine
data:
  NODE_ENV: "production"
  APP_URL: "https://www.liinemodelmanagement.com"
  NEXT_PUBLIC_APP_URL: "https://www.liinemodelmanagement.com"
  MONGODB_DB: "liine"
  # Object storage (MinIO). Credentials live in the `liine-app` Secret.
  S3_ENDPOINT: "http://minio.liine.svc.cluster.local:9000"
  S3_BUCKET: "liine"
  S3_REGION: "us-east-1"
