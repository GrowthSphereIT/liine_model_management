# Ingress for liinemodelmanagement.com — TLS terminated by cert-manager (Let's Encrypt).
# Apex (liinemodelmanagement.com) is redirected to the canonical www host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liine
  namespace: liine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - liinemodelmanagement.com
        - www.liinemodelmanagement.com
      secretName: liine-tls
  rules:
    - host: www.liinemodelmanagement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: liine
                port:
                  number: 80
    - host: liinemodelmanagement.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: liine
                port:
                  number: 80
