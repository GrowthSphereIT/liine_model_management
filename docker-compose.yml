services:
  mongo:
    image: mongo:7
    container_name: liine-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-liine}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-liine_dev_password}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-liine}
    ports:
      # Exposed on the host so `npm run dev` (outside Docker) can reach the DB.
      - "27017:27017"
    volumes:
      - liine-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: liine-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-liine}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-liine_dev_password}
    ports:
      # API on 9000 (used by the app), web console on 9001.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - liine-minio-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liine-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Inside the compose network the DB host is the service name `mongo`.
      - MONGODB_URI=mongodb://${MONGO_USER:-liine}:${MONGO_PASSWORD:-liine_dev_password}@mongo:27017/${MONGO_DB:-liine}?authSource=admin
      - MONGODB_DB=${MONGO_DB:-liine}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-liine}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-long-random-string-in-production}
      # Object storage — the API host inside the network is the service `minio`.
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-liine}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-liine}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-liine_dev_password}
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  liine-mongo-data:
  liine-minio-data:
