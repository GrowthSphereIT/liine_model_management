name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image
        run: echo name=${GITHUB_REPOSITORY,,} >> $GITHUB_OUTPUT

      - name: Set release tag
        id: ver
        shell: bash
        run: |
          if [[ ${GITHUB_EVENT_NAME} == release ]]; then
            echo tag=${GITHUB_EVENT_RELEASE_TAG_NAME:-${GITHUB_REF_NAME}} >> $GITHUB_OUTPUT
          else
            echo tag=${GITHUB_REF_NAME} >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.liinemodelmanagement.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Sync K8s Secrets from GitHub environment secrets
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: bash deploy/scripts/apply-secrets.sh

      - name: Pin image tag in kustomize overlay
        working-directory: deploy/k8s/overlays/prod
        run: |
          kustomize edit set image \
            ghcr.io/codesphereit/liine=ghcr.io/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.tag }}

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl -n liine rollout status \
            deployment/liine --timeout=5m
